name: PWA Deploy

# GitHub Pages source is configured to GitHub Actions.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Validate PWA source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f vta-theme.css
          test -f plant-location-imagery.css
          test -f js/plant-location-imagery.js
          test -d js
          node --check js/plant-location-imagery.js
          grep -q 'vta-theme.css?v=0.11.0-alpha.71-nano1' index.html
          grep -q 'plant-location-imagery.css?v=0.11.0-alpha.69' index.html
          grep -q 'js/plant-location-imagery.js?v=0.11.0-alpha.69' index.html
          grep -q "v0.11.0-alpha.71-nano1" service-worker.js
          grep -q 'vta-theme.css?v=0.11.0-alpha.71-nano1' service-worker.js
          grep -q 'Nano Water Technology Theme' vta-theme.css
          grep -q -- '--nano-grid:' vta-theme.css
          grep -q 'schema3d-section::before' vta-theme.css
          grep -q 'plant-location-imagery-head' vta-theme.css
          grep -q '"theme_color": "#071d2a"' manifest.webmanifest
          grep -q '"name": "VTA Copilot"' manifest.webmanifest

      - name: Prepare static PWA artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          find . -maxdepth 1 -type f \
            \( -name '*.html' \
            -o -name '*.css' \
            -o -name '*.webmanifest' \
            -o -name '*.png' \
            -o -name '*.webp' \
            -o -name '*.svg' \
            -o -name '*.ico' \) \
            -exec cp '{}' _site/ \;

          cp service-worker.js _site/service-worker.js
          cp -R js _site/js
          if [ -d images ]; then cp -R images _site/images; fi
          if [ -d products ]; then cp -R products _site/products; fi
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/vta-theme.css
          test -f _site/plant-location-imagery.css
          test -f _site/service-worker.js
          test -f _site/js/app.js
          test -f _site/js/plant-location-imagery.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy PWA
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
