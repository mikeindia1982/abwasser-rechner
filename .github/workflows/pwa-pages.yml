name: PWA Deploy

# GitHub Pages source is configured to GitHub Actions.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Validate PWA source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f vta-theme.css
          test -f plant-location-imagery.css
          test -f plant-gps-summary.css
          test -f newsletter-consent.css
          test -f page-transitions.css
          test -f influent-dosing-calculator.css
          test -f knowledge.css
          test -f js/plant-location-imagery.js
          test -f js/plant-gps-summary.js
          test -f js/newsletter-consent.js
          test -f js/page-transitions.js
          test -f js/influent-dosing-calculator.js
          test -f js/product-dosing-profiles.js
          test -f js/product-dosing-profile-ui.js
          test -f js/knowledge-entry.js
          test -f js/components/knowledge-base.js
          test -f js/repositories/knowledge-repository.js
          test -f js/knowledge/knowledge-seed-data.js
          test -f js/services/knowledge-seed-service.js
          test -f tests/influent-dosing.test.mjs
          test -d js
          node --check js/plant-location-imagery.js
          node --check js/plant-gps-summary.js
          node --check js/newsletter-consent.js
          node --check js/page-transitions.js
          node --check js/influent-dosing-calculator.js
          node --check js/product-dosing-profiles.js
          node --check js/product-dosing-profile-ui.js
          node --input-type=module --check < js/knowledge-entry.js
          node --input-type=module --check < js/components/knowledge-base.js
          node --input-type=module --check < js/repositories/knowledge-repository.js
          node --input-type=module --check < js/knowledge/knowledge-seed-data.js
          node --input-type=module --check < js/services/knowledge-seed-service.js
          node tests/influent-dosing.test.mjs
          grep -q 'vta-theme.css?v=0.11.0-alpha.71-nano1' index.html
          grep -q 'plant-location-imagery.css?v=0.11.0-alpha.69' index.html
          grep -q 'plant-gps-summary.css?v=0.11.0-alpha.73-gps-summary1' index.html
          grep -q 'newsletter-consent.css?v=0.11.0-alpha.74-newsletter-consent1' index.html
          grep -q 'page-transitions.css?v=0.11.0-alpha.75-page-transitions2' index.html
          grep -q 'influent-dosing-calculator.css?v=0.11.0-alpha.76-influent-dosing1' index.html
          grep -q 'knowledge.css' index.html
          grep -q 'js/plant-location-imagery.js?v=0.11.0-alpha.69' index.html
          grep -q 'js/plant-gps-summary.js?v=0.11.0-alpha.73-gps-summary1' index.html
          grep -q 'js/newsletter-consent.js?v=0.11.0-alpha.74-newsletter-consent1' index.html
          grep -q 'js/page-transitions.js?v=0.11.0-alpha.75-page-transitions2' index.html
          grep -q 'js/product-dosing-profile-ui.js?v=0.11.0-alpha.76-influent-dosing1' index.html
          grep -q 'js/knowledge-entry.js' index.html
          node -e 'const fs=require("fs"); const sw=fs.readFileSync("service-worker.js","utf8"); if(!/const CACHE=`\$\{CACHE_PREFIX\}v[^`]+`;/.test(sw)){throw new Error("Service-worker cache version missing or invalid")}'
          grep -q 'plant-gps-summary.css?v=0.11.0-alpha.73-gps-summary1' service-worker.js
          grep -q 'js/plant-gps-summary.js?v=0.11.0-alpha.73-gps-summary1' service-worker.js
          grep -q 'newsletter-consent.css?v=0.11.0-alpha.74-newsletter-consent1' service-worker.js
          grep -q 'js/newsletter-consent.js?v=0.11.0-alpha.74-newsletter-consent1' service-worker.js
          grep -q 'page-transitions.css?v=0.11.0-alpha.75-page-transitions2' service-worker.js
          grep -q 'js/page-transitions.js?v=0.11.0-alpha.75-page-transitions2' service-worker.js
          grep -q 'influent-dosing-calculator.css?v=0.11.0-alpha.76-influent-dosing1' service-worker.js
          grep -q 'js/influent-dosing-calculator.js' service-worker.js
          grep -q 'js/product-dosing-profiles.js' service-worker.js
          grep -q 'js/product-dosing-profile-ui.js?v=0.11.0-alpha.76-influent-dosing1' service-worker.js
          grep -q 'vta-theme.css?v=0.11.0-alpha.71-nano1' service-worker.js
          grep -q 'knowledge.css' service-worker.js
          grep -q 'js/knowledge-entry.js' service-worker.js
          grep -q 'js/components/knowledge-base.js' service-worker.js
          grep -q 'js/repositories/knowledge-repository.js' service-worker.js
          grep -q 'js/knowledge/knowledge-seed-data.js' service-worker.js
          grep -q 'js/services/knowledge-seed-service.js' service-worker.js
          grep -q 'Nano Water Technology Theme' vta-theme.css
          grep -q -- '--nano-grid:' vta-theme.css
          grep -q 'schema3d-section::before' vta-theme.css
          grep -q 'plant-location-imagery-head' vta-theme.css
          grep -q 'SCHRITT 1 · STANDORT' plant-location-imagery.css
          grep -q 'form-section:has(.location-capture-card)' plant-location-imagery.css
          grep -q 'Standort übernommen' js/plant-gps-summary.js
          grep -q 'Betreiber / Verband' js/plant-gps-summary.js
          grep -q 'plant-gps-summary-grid' plant-gps-summary.css
          grep -q 'CONSENT_TEXT_VERSION' js/newsletter-consent.js
          grep -q 'in-person-device-confirmation' js/newsletter-consent.js
          grep -q 'Double-Opt-In' js/newsletter-consent.js
          grep -q 'newsletter-consent-panel' newsletter-consent.css
          grep -q 'startViewTransition' js/page-transitions.js
          grep -q 'prefers-reduced-motion' js/page-transitions.js
          grep -q 'view-transition-name:vta-main' page-transitions.css
          grep -q "id:'influent-dosing'" js/influent-dosing-calculator.js
          grep -q 'calculateInfluentDose' js/influent-dosing-calculator.js
          grep -q 'activePlantContext' js/influent-dosing-calculator.js
          grep -q 'vta-product-dosing-profiles' js/product-dosing-profiles.js
          grep -q 'Im Dosierrechner verwenden' js/product-dosing-profile-ui.js
          grep -q 'influentDosingCalculator' js/calculators.js
          grep -q 'influent-dose-result-grid' influent-dosing-calculator.css
          grep -q '"theme_color": "#071d2a"' manifest.webmanifest
          grep -q '"name": "VTA Copilot"' manifest.webmanifest

      - name: Prepare static PWA artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          find . -maxdepth 1 -type f \
            \( -name '*.html' \
            -o -name '*.css' \
            -o -name '*.webmanifest' \
            -o -name '*.png' \
            -o -name '*.webp' \
            -o -name '*.svg' \
            -o -name '*.ico' \) \
            -exec cp '{}' _site/ \;

          cp service-worker.js _site/service-worker.js
          cp -R js _site/js
          if [ -d images ]; then cp -R images _site/images; fi
          if [ -d products ]; then cp -R products _site/products; fi
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/vta-theme.css
          test -f _site/plant-location-imagery.css
          test -f _site/plant-gps-summary.css
          test -f _site/newsletter-consent.css
          test -f _site/page-transitions.css
          test -f _site/influent-dosing-calculator.css
          test -f _site/knowledge.css
          test -f _site/service-worker.js
          test -f _site/js/app.js
          test -f _site/js/plant-location-imagery.js
          test -f _site/js/plant-gps-summary.js
          test -f _site/js/newsletter-consent.js
          test -f _site/js/page-transitions.js
          test -f _site/js/influent-dosing-calculator.js
          test -f _site/js/product-dosing-profiles.js
          test -f _site/js/product-dosing-profile-ui.js
          test -f _site/js/knowledge-entry.js
          test -f _site/js/components/knowledge-base.js
          test -f _site/js/repositories/knowledge-repository.js
          test -f _site/js/knowledge/knowledge-seed-data.js
          test -f _site/js/services/knowledge-seed-service.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy PWA
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4