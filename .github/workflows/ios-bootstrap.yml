name: ios bootstrap

on:
  push:
    branches: [develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'js/native-runtime.js'
      - 'ios/**'
      - '.github/workflows/ios-bootstrap.yml'
      - 'index.html'
      - '*.css'
      - 'images/**'
      - 'products/**'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'js/native-runtime.js'
      - 'ios/**'
      - '.github/workflows/ios-bootstrap.yml'
      - 'index.html'
      - '*.css'
      - 'images/**'
      - 'products/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Capacitor dependencies
        run: npm ci --ignore-scripts
      - name: Build native web bundle
        run: npm run native:build
      - name: Ensure iOS project exists
        run: |
          if [ ! -d ios/App/App.xcodeproj ]; then
            npx cap add ios
          fi
      - name: Synchronize plugins and web bundle
        run: npx cap sync ios
      - name: Check committed native metadata is synchronized
        run: |
          rm -rf ios/App/App/public
          git diff --exit-code -- ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile iOS app for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive iOS project for inspection
        uses: actions/upload-artifact@v4
        with:
          name: vta-copilot-ios-scaffold
          path: ios
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
