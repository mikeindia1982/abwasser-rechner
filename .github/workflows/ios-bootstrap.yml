name: ios bootstrap

on:
  push:
    branches: [develop]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'js/native-runtime.js'
      - '.github/workflows/ios-bootstrap.yml'
      - 'index.html'
      - '*.css'
      - 'images/**'
      - 'products/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xcode-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        run: npm install --package-lock=false --ignore-scripts
      - name: Build native web bundle
        run: npm run native:build
      - name: Generate iOS project
        run: npx cap add ios
      - name: Synchronize plugins and web bundle
        run: npx cap sync ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile iOS app for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Commit validated iOS project to develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          rm -rf ios/App/App/public
          git add ios
          if git diff --cached --quiet; then
            echo 'Generated iOS project is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add validated Capacitor iOS project'
          git push origin HEAD:develop
      - name: Archive generated iOS project for inspection
        uses: actions/upload-artifact@v4
        with:
          name: vta-copilot-ios-scaffold
          path: ios
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
