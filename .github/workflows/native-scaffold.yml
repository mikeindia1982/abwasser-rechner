name: native scaffold

on:
  push:
    branches: [develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'js/native-*.js'
      - 'ios/App/App/*.swift'
      - 'ios/App/App/Info.plist'
      - 'tests/native-scaffold.test.mjs'
      - '.github/workflows/native-scaffold.yml'
      - 'index.html'
      - '*.css'
      - 'images/**'
      - 'products/**'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'js/native-*.js'
      - 'ios/App/App/*.swift'
      - 'ios/App/App/Info.plist'
      - 'tests/native-scaffold.test.mjs'
      - '.github/workflows/native-scaffold.yml'
      - 'index.html'
      - '*.css'
      - 'images/**'
      - 'products/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Capacitor dependencies
        run: npm ci --ignore-scripts
      - name: Native scaffold tests
        run: npm run test:native-scaffold
      - name: Build native web bundle
        run: npm run native:build
      - name: Native doctor
        run: npm run native:doctor
      - name: Verify native bundle
        run: |
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/native-runtime.js
          test -f dist/js/native-ui-hardening.js
          test -f dist/js/native-ios-integration.js
          test -f dist/js/native-firebase-auth.js
          test -f dist/native-ios.css
          test -f dist/native-ios-detail-fixes.css
          test -f dist/native-ios-integration.css
          test -f dist/native-build.json
          grep -q 'native-ios.css' dist/index.html
          grep -q 'native-ios-detail-fixes.css' dist/index.html
          grep -q 'native-ios-integration.css' dist/index.html
          grep -q 'native-ui-hardening.js' dist/index.html
          grep -q 'native-ios-integration.js' dist/index.html
          grep -q 'native-firebase-auth.js' dist/index.html
          grep -q 'VTANativeIntegrationPlugin' ios/App/App/SceneDelegate.swift
          grep -q 'NSCalendarsFullAccessUsageDescription' ios/App/App/Info.plist
          test ! -d dist/preview-alpha47
          test ! -f dist/service-worker.js
