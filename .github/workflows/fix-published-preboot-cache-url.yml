name: Fix published preview preboot cache URL

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-published-preboot-cache-url.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Patch published preboot asset URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('preview-alpha47/index.html')
          text=path.read_text()
          old='js/platform/tenant-preboot.js?v=preview-alpha47'
          new='js/platform/tenant-preboot.js?v=preview-alpha47-fix1'
          if old not in text:
              raise SystemExit('expected preboot URL not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-alpha47/index.html
          git commit -m "Cache-bust published tenant preboot cleanup"
          git push origin HEAD:develop
