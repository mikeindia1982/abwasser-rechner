name: Fix preview preboot cache URL

on:
  push:
    branches:
      - preview/tenant-platform-alpha47
    paths:
      - .github/workflows/fix-preboot-cache-url.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/tenant-platform-alpha47
      - name: Patch preboot asset URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text()
          old='js/platform/tenant-preboot.js?v=preview-alpha47'
          new='js/platform/tenant-preboot.js?v=preview-alpha47-fix1'
          if old not in text:
              raise SystemExit('expected preboot URL not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cache-bust tenant preboot cleanup"
          git push origin HEAD:preview/tenant-platform-alpha47
